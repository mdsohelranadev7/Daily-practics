<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body id="body">
    <div class="m-5">
        <div id="display">
            00:00:00
        </div>

        <button id="start">start</button>
        <button id="stop">stop</button>
        <button id="reset">reset </button>
    </div>





    <div class="m-5">
        <div class="" id="displaybtn">
            00:00
        </div>

        <div class="">
            <input id="inputbtn" class="border" type="number" placeholder="enter minit">
            <button id="startbtn">start</button>
            <button id="stopbtn">stop</button>
            <button id="resetbtn">reset</button>
        </div>
    </div>



    <div id="switchs" class=" m-5 w-12 h-6 bg-gray-400 rounded-full p-1 cursor-pointer">
        <div id="circle" class="w-4 h-4 bg-red-500 rounded-full transition-transform"></div>
    </div>







    <div id="sw" class="bg-gray-500 h-5 w-14 rounded-[40px] ml-5 relative">
        <div id="bt" class="active bg-red-200 h-4 w-4 rounded-full absolute top-1/2 left-1 -translate-y-1/2 transition-transform">

        </div>
    </div>



    <div class=" m-5">
        <div id="disp" class="">0</div>
        <button id="plus" class="px-5 py-2 bg-gray-600 text-white">+</button>
        <button id="minus" class="px-5 py-2 bg-gray-600 text-white">-</button>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
