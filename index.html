<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Color Filter</title>
   <link rel="stylesheet" href="src/all.min.css">
   <link rel="stylesheet" href="src/output.css">
</head>

<body>
   <form>
      <div class="">
         <!-- Calculator -->
         <div id="calculator" class="w-87.5 bg-gray-900 p-5 rounded-3xl shadow-2xl">

            <!-- Display -->
            <div id="displayBox" class="bg-gray-800 rounded-2xl p-4 mb-5">


               <input id="display" type="text"
                  class="w-full bg-transparent text-white text-4xl text-right outline-none">

            </div>


            <!-- Calculator Buttons -->
            <div id="buttons" class="grid grid-cols-4 gap-3">

               <!-- Row 1 -->

               <button id="clearBtn" type="button"
                  class="h-16 rounded-xl bg-gray-600 text-white text-xl hover:bg-gray-500">
                  AC
               </button>

               <button id="plusMinusBtn" type="button"
                  class="h-16 rounded-xl bg-gray-600 text-white text-xl hover:bg-gray-500">
                  +/-
               </button>

               <button id="percentBtn" type="button"
                  class="h-16 rounded-xl bg-gray-600 text-white text-xl hover:bg-gray-500">
                  %
               </button>

               <button id="divideBtn" type="button"
                  class="h-16 rounded-xl bg-orange-500 text-white text-xl hover:bg-orange-400">
                  ÷
               </button>


               <!-- Row 2 -->

               <button id="sevenBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  7
               </button>

               <button id="eightBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  8
               </button>

               <button id="nineBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  9
               </button>

               <button id="multiplyBtn" type="button"
                  class="h-16 rounded-xl bg-orange-500 text-white text-xl hover:bg-orange-400">
                  ×
               </button>


               <!-- Row 3 -->

               <button id="fourBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  4
               </button>

               <button id="fiveBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  5
               </button>

               <button id="sixBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  6
               </button>

               <button id="minusBtn" type="button"
                  class="h-16 rounded-xl bg-orange-500 text-white text-xl hover:bg-orange-400">
                  −
               </button>


               <!-- Row 4 -->

               <button id="oneBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  1
               </button>

               <button id="twoBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  2
               </button>

               <button id="threeBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  3
               </button>

               <button id="plusBtn" type="button"
                  class="h-16 rounded-xl bg-orange-500 text-white text-xl hover:bg-orange-400">
                  +
               </button>


               <!-- Row 5 -->

               <button id="zeroBtn" type="button"
                  class="h-16 col-span-2 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  0
               </button>

               <button id="decimalBtn" type="button"
                  class="h-16 rounded-xl bg-gray-800 text-white text-xl hover:bg-gray-700">
                  .
               </button>

               <button id="equalBtn" type="submit"
                  class="h-16 rounded-xl bg-green-500 text-white text-xl hover:bg-green-400">
                  =
               </button>

            </div>

         </div>

      </div>
   </form>




   <div class="m-5">
      <input id="s" type="text" class="border">

      <div class="item-list flex">
         <div class="product bg-red-600 w-5 m-5 px-2 text-white" data-sk="red">ad</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-green-600 w-5 m-5 px-2 text-white" data-sk="green">green</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-green-600 w-5 m-5 px-2 text-white" data-sk="green">green</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-red-600 w-5 m-5 px-2 text-white" data-sk="red">red</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-green-600 w-5 m-5 px-2 text-white" data-sk="green">green</div>
         <div class="product bg-red-600 w-5 m-5 px-2 text-white" data-sk="red">red</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-red-600 w-5 m-5 px-2 text-white" data-sk="red">red</div>
         <div class="product bg-red-600 w-5 m-5 px-2 text-white" data-sk="red">red</div>
         <div class="product bg-red-600 w-5 m-5 px-2 text-white" data-sk="red">red</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-green-600 w-5 m-5 px-2 text-white" data-sk="green">green</div>
         <div class="product bg-green-600 w-5 m-5 px-2 text-white" data-sk="green">green</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-green-600 w-5 m-5 px-2 text-white" data-sk="green">green</div>
         <div class="product bg-green-600 w-5 m-5 px-2 text-white" data-sk="green">green</div>
         <div class="product bg-blue-600 w-5 m-5 px-2 text-white" data-sk="blue">blue</div>
         <div class="product bg-black w-5 m-5 px-2 text-white" data-sk="black">blue</div>
         <div class="product bg-gray-400 w-5 m-5 px-2 text-black" data-sk="white">blue</div>
      </div>

   </div>




   <div class="m-5">
      <p id="timescreen">00:00:00</p>
      <button id="start" class="border">Start</button>
      <button id="stop" class="border">Stop</button>
      <button id="reset" class="border">Reset</button>
   </div>



   <div class="">
      <input id="inp" class="border" type="text">
      <button id="add" onclick="als(this)">Add</button>
      <button id="deleteall">Delete all</button>
      <ul id="ulbtn"></ul>
   </div>



   <div class=" h-50 w-50 m-10 border relative">
      <span id="cptext"
         class="border absolute right-0 top-0 p-1 translate-x-full duration-400 transition inline-block opacity-0">Copy
         text</span>
      <button id="copy" class="border mt-10">copy</button>
   </div>










   <div id="rou" class=" py-2 px-5 bg-amber-400 w-35 m-10 rounded-4xl">
      <button id="on" class="bg-amber-50 rounded-full p-2 duration-500">on</button>
   </div>



   <div class="m-5">
      <input id="inps" class="border px-5" type="text" placeholder="enter text">
   </div>

   <div class="">
      <div class="productt" data-name="red">
         <h2 class="bg-red-500 w-10">sohel</h2>

      </div>
      <div class="productt" data-name="blue">
         <h2 class="bg-blue-500 w-10">sohel</h2>

      </div>
      <div class="productt" data-name="green">
         <h2 class="bg-green-500 w-10">sohel</h2>

      </div>

   </div>














   <div class="m-20 flex gap-x-2">

      <label for="">Name:</label>

      <div class="" id="sort">
         <select name="" id="select" class="border px-5">
            <option value="none">none</option>
            <option value="red">red</option>
            <option value="green">green</option>
            <option value="blue">blue</option>
         </select>
      </div>



   </div>


   <div class="m-5 grid grid-cols-4 gap-y-2">
      <div class="bg-red-500 w-20 text-center product" data-catagory="red">red</div>
      <div class="bg-green-500 w-20 text-center product" data-catagory="green">green</div>
      <div class="bg-blue-500 w-20 text-center product" data-catagory="blue">blue</div>
      <div class="bg-red-500 w-20 text-center product" data-catagory="red">red</div>
      <div class="bg-blue-500 w-20 text-center product" data-catagory="blue">blue</div>
      <div class="bg-green-500 w-20 text-center product" data-catagory="green">green</div>
      <div class="bg-blue-500 w-20 text-center product" data-catagory="blue">blue</div>
   </div>



   <button id="btns" class="border px-10 duration-300">Dark</button>
   <div id="bg" class="w-120 h-120 border m-50 flex justify-center items-center">

      <input id="ins" class="border mr-2" type="text">
      <button id="colorBtn"
         class="border px-5 py-1 rounded-2xl hover:bg-green-800 hover:text-white cursor-pointer">Color</button>


   </div>




   <div class="m-10">
      <input id="ip" class="border" type="text">
      <button id="a">add</button>
      <button id="al">deleteall</button>

      <ul id="u"></ul>
   </div>

   <input class="border m-10" type="text" id="sls">
   <button id="ckl">click</button>





   <script src="js/script.js"></script>
</body>

</html>
